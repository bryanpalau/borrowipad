<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPad Express Checkout</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root{
      --primary:#4f46e5;
      --success:#10b981;
      --bg:#0f172a;
      --panel:#1e293b;
      --danger:#ef4444;
      --gray:#334155;
      --warning:#f59e0b;
      --vh:1vh;
    }

    *{ box-sizing:border-box; }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:#fff;
      margin:0;
      display:flex;
      flex-direction:column;
      height:calc(var(--vh) * 100);
      overflow:hidden;
      -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .header{
      padding:10px;
      background:var(--panel);
      border-bottom:1px solid var(--gray);
      flex-shrink:0;
    }

    .mode-toggle{
      display:flex;
      background:#0f172a;
      border-radius:10px;
      padding:4px;
      margin:0 auto;
      width:min(520px, 100%);
    }

    .mode-btn{
      flex:1;
      padding:12px;
      border:none;
      border-radius:8px;
      color:#94a3b8;
      background:none;
      font-size:1.05rem;
      font-weight:800;
      cursor:pointer;
      transition:0.2s;
    }

    .mode-btn.active{
      background:var(--primary);
      color:#fff;
    }

    #reader-container{
      width:min(560px, 100%);
      margin:10px auto 0;
      padding:0 12px;
      position:relative;
      flex-shrink:0;
    }

    #reader{
      width:100% !important;
      height:clamp(220px, 38vh, 360px) !important;
      background:#000;
      border-radius:14px;
      overflow:hidden;
      border:2px solid var(--gray);
      position:relative;
    }

    #reader video{
      width:100% !important;
      height:100% !important;
      object-fit:cover !important;
    }

    .scan-overlay{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:min(260px, 72vw);
      height:min(260px, 72vw);
      max-width:260px;
      max-height:260px;
      border:3px solid var(--success);
      border-radius:14px;
      pointer-events:none;
      opacity:0.55;
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%,100%{ opacity:0.55; }
      50%{ opacity:0.25; }
    }

    .scan-corner{
      width:22px;
      height:22px;
      position:absolute;
      border:4px solid var(--success);
    }
    .scan-corner.tl{ top:-2px; left:-2px; border-right:none; border-bottom:none; border-top-left-radius:14px; }
    .scan-corner.tr{ top:-2px; right:-2px; border-left:none; border-bottom:none; border-top-right-radius:14px; }
    .scan-corner.bl{ bottom:-2px; left:-2px; border-right:none; border-top:none; border-bottom-left-radius:14px; }
    .scan-corner.br{ bottom:-2px; right:-2px; border-left:none; border-top:none; border-bottom-right-radius:14px; }

    .start-overlay{
      position:absolute;
      inset:0;
      background:rgba(15,23,42,0.72);
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      z-index:10;
    }

    .start-btn{
      padding:14px 18px;
      border:none;
      border-radius:14px;
      background:var(--primary);
      color:#fff;
      font-weight:900;
      font-size:1.05rem;
      cursor:pointer;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }

    .overlay{
      flex:1;
      width:min(560px, 100%);
      margin:0 auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:hidden;
    }

    #userPanel{
      display:none;
      justify-content:space-between;
      align-items:center;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      padding:10px 12px;
      border-radius:12px;
      font-weight:800;
    }

    .status-banner{
      padding:12px;
      border-radius:12px;
      text-align:center;
      font-weight:900;
      font-size:1.05rem;
      border:1px solid rgba(255,255,255,0.12);
      user-select:none;
    }

    .status-waiting{ background:rgba(59,130,246,0.15); color:#bfdbfe; }
    .status-success{ background:rgba(16,185,129,0.18); color:#a7f3d0; }
    .status-error{ background:rgba(239,68,68,0.18); color:#fecaca; }
    .status-warning{ background:rgba(245,158,11,0.18); color:#fde68a; }

    #historyList{
      display:none;
      overflow:auto;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.04);
      padding:8px;
      max-height:30vh;
    }

    .history-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.08);
      margin-bottom:8px;
    }

    .history-label{
      font-weight:900;
      letter-spacing:0.4px;
    }

    .delete-btn{
      background:rgba(239,68,68,0.2);
      color:#ff8080;
      border:1px solid var(--danger);
      padding:8px 12px;
      border-radius:10px;
      font-weight:900;
      font-size:0.8rem;
      cursor:pointer;
    }

    .action-bar{
      display:flex;
      gap:10px;
      margin-top:auto;
      height:56px;
    }

    .btn-action{
      flex:1;
      border:none;
      border-radius:14px;
      font-weight:900;
      cursor:pointer;
      background:rgba(255,255,255,0.08);
      color:#fff;
      border:1px solid rgba(255,255,255,0.14);
      font-size:1rem;
    }

    .btn-clear{ background:rgba(239,68,68,0.18); border-color:rgba(239,68,68,0.38); }
    .btn-finish{ background:rgba(16,185,129,0.18); border-color:rgba(16,185,129,0.35); }

    .btn-finish:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    @media (max-width:480px){
      .overlay{ padding:14px; }
      .mode-btn{ font-size:0.95rem; padding:10px; }
      .action-bar{ gap:8px; height:52px; }
      .btn-action{ font-size:0.9rem; }
      .scan-overlay{ border-width:2px; }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="mode-toggle">
      <button id="btnBorrow" class="mode-btn active" onclick="setMode('borrow')">BORROW</button>
      <button id="btnReturn" class="mode-btn" onclick="setMode('return')">RETURN</button>
    </div>
  </div>

  <div id="reader-container">
    <div id="reader"></div>

    <div class="scan-overlay">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
    </div>

    <div id="startOverlay" class="start-overlay">
      <button class="start-btn" onclick="userStart()">Tap to Start Scanning</button>
    </div>
  </div>

  <div class="overlay">
    <div id="userPanel">
      <div>User: <b id="currentUserId" style="color:var(--primary)">-</b></div>
      <div id="sessionCount">Qty: 0</div>
    </div>

    <div id="statusBanner" class="status-banner status-waiting">TAP TO START</div>

    <div id="historyList"></div>

    <div class="action-bar">
      <button class="btn-action btn-clear" onclick="clearAll()">Clear All</button>
      <button class="btn-action" onclick="toggleHistory()">Review</button>
      <button id="finishBtn" class="btn-action btn-finish" onclick="finishSession()">Finish & Save</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRxHB9wRtAMVvCD9blsJdw3QyKxKdu3MPaeYG4scD8vk-Ep4ZB0uhZJNmFvqKDimQ/exec";
    const DEBUG_MODE = false;

    let mode = "borrow";
    let userId = null;
    let sessionHistory = [];
    let isProcessing = false;

    let unavailableIpads = [];
    let unavailableCacheTs = 0;

    let knownIpadsSet = new Set();
    let knownUsersSet = new Set();
    let inventoryCacheTs = 0;
    let rosterCacheTs = 0;

    let lastScanned = null;
    let lastScanTime = 0;

    let html5QrCode = null;
    let scannerStarted = false;

    let audioCtx = null;

    let historyDom = new Map();

    function log(...args){ if (DEBUG_MODE) console.log(...args); }

    function setVh(){
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty("--vh", `${vh}px`);
    }
    window.addEventListener("resize", setVh);
    setVh();

    function setMode(newMode){
      if (mode === newMode) return;
      mode = newMode;

      document.getElementById("btnBorrow").classList.toggle("active", mode === "borrow");
      document.getElementById("btnReturn").classList.toggle("active", mode === "return");

      clearAll(true);
      updateBanner(mode === "borrow" ? "STEP 1: SCAN USER ID" : "RETURN MODE. SCAN IPAD", "status-waiting");
    }

    function updateBanner(text, cls){
      const b = document.getElementById("statusBanner");
      b.innerText = text;
      b.className = "status-banner " + cls;
      b.onclick = null;
      log("Banner:", text);
    }

    function makeRequestId(){
      try{
        if (crypto && crypto.randomUUID) return crypto.randomUUID();
      } catch(e){}
      return "RID_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    function initAudioContext(){
      try{
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      } catch(e){}
    }

    function playBeep(freq = 880, duration = 120){
      try{
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        g.gain.value = 0.05;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        setTimeout(() => { try{ o.stop(); } catch(e){} }, duration);
      } catch(e){}
    }

    function playError(){
      playBeep(220, 140);
      setTimeout(() => playBeep(180, 140), 150);
    }

    function vibrate(ms){
      try{
        if (navigator.vibrate) navigator.vibrate(ms);
      } catch(e){}
    }

    async function userStart(){
      initAudioContext();
      vibrate(20);
      document.getElementById("startOverlay").style.display = "none";
      updateBanner("STARTING CAMERA...", "status-waiting");
      await startScanner();
    }

    async function syncSystemCache(retryCount = 0){
      const maxRetries = 3;
      try{
        const resp = await fetch(SCRIPT_URL, { method:"GET", cache:"no-cache" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || "Bad response");

        unavailableIpads = (data.borrowed || [])
          .map(x => (x || "").toString().trim().toUpperCase())
          .filter(Boolean);
        unavailableCacheTs = Date.now();

        const inv = (data.inventoryIds || [])
          .map(x => (x || "").toString().trim().toUpperCase())
          .filter(Boolean);
        knownIpadsSet = new Set(inv);
        inventoryCacheTs = Date.now();

        const users = (data.userIds || [])
          .map(x => (x || "").toString().trim().toUpperCase())
          .filter(Boolean);
        knownUsersSet = new Set(users);
        rosterCacheTs = Date.now();

        updateBanner(mode === "borrow" ? "READY. SCAN USER ID" : "RETURN MODE. SCAN IPAD", "status-waiting");
      } catch(err){
        console.warn("Cache sync failed", err);
        if (retryCount < maxRetries){
          await new Promise(r => setTimeout(r, 400 + retryCount * 300));
          return syncSystemCache(retryCount + 1);
        }
        updateBanner("SYNC FAILED. TAP TO RETRY", "status-error");
        document.getElementById("statusBanner").onclick = () => {
          document.getElementById("statusBanner").onclick = null;
          syncSystemCache(0);
        };
      }
    }

    async function startScanner(){
  try{
    if (scannerStarted) return;

    html5QrCode = new Html5Qrcode("reader");

    const qrboxFn = (viewfinderWidth, viewfinderHeight) => {
      const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
      const size = Math.floor(Math.max(220, Math.min(360, minEdge * 0.75)));
      return { width: size, height: size };
    };

    const config = {
      fps: 12,
      qrbox: qrboxFn,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    const devices = await Html5Qrcode.getCameras();
    if (!devices || devices.length === 0) throw new Error("No camera found");

    const backCam =
      devices.find(d => /back|rear|environment/i.test(d.label || "")) ||
      devices[devices.length - 1];

    await html5QrCode.start(
      backCam.id,
      config,
      onScanSuccess,
      () => {}
    );

    scannerStarted = true;
    updateBanner("SYNCING STATUS...", "status-waiting");
    await syncSystemCache();
  } catch(err){
    console.error(err);

    const msg = (err && err.message) ? err.message : String(err);
    updateBanner("CAMERA ERROR. TAP TO RETRY", "status-error");

    // Optional: show the real reason on screen for fast debugging
    if (DEBUG_MODE) {
      updateBanner("CAMERA ERROR: " + msg, "status-error");
    }

    document.getElementById("startOverlay").style.display = "flex";
    document.getElementById("statusBanner").onclick = () => {
      document.getElementById("statusBanner").onclick = null;
      userStart();
    };
  }
}


    async function restartScanner(){
      try{
        if (!html5QrCode) return;
        if (html5QrCode.isScanning){
          await html5QrCode.stop();
        }
        scannerStarted = false;
        await startScanner();
      } catch(e){
        log("Restart scanner failed:", e);
      }
    }

    async function hardResetScanner(){
      try{
        if (html5QrCode){
          if (html5QrCode.isScanning){
            await html5QrCode.stop();
          }
          html5QrCode.clear();
        }
      } catch(e){
        console.warn("Scanner stop failed", e);
      }

      html5QrCode = null;
      scannerStarted = false;

      lastScanned = null;
      lastScanTime = 0;

      await new Promise(r => setTimeout(r, 150));
      await startScanner();
    }

    window.addEventListener("orientationchange", () => setTimeout(restartScanner, 450));
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) setTimeout(restartScanner, 450);
    });

    function updateCount_(){
      document.getElementById("sessionCount").innerText = "Qty: " + sessionHistory.length;
    }

    function ensureHistoryVisible_(){
      const list = document.getElementById("historyList");
      if (list.style.display !== "block") list.style.display = "block";
    }

    function addHistoryRowBottom_(ipadId){
      const list = document.getElementById("historyList");
      ensureHistoryVisible_();

      const row = document.createElement("div");
      row.className = "history-row";

      const label = document.createElement("span");
      label.className = "history-label";
      label.textContent = ipadId;

      const btn = document.createElement("button");
      btn.className = "delete-btn";
      btn.textContent = "DELETE";
      btn.onclick = () => removeById_(ipadId);

      row.appendChild(label);
      row.appendChild(btn);

      list.appendChild(row);
      historyDom.set(ipadId, row);
      updateCount_();
    }

    function removeById_(ipadId){
      const idx = sessionHistory.indexOf(ipadId);
      if (idx >= 0) sessionHistory.splice(idx, 1);

      const el = historyDom.get(ipadId);
      if (el && el.parentNode) el.parentNode.removeChild(el);
      historyDom.delete(ipadId);

      updateCount_();
      if (sessionHistory.length === 0) {
        document.getElementById("historyList").style.display = "none";
        updateBanner(userId ? "READY. SCAN NEXT IPAD" : "STEP 1: SCAN USER ID", "status-waiting");
      }
    }

    function clearHistoryDom_(){
      historyDom.clear();
      const list = document.getElementById("historyList");
      list.innerHTML = "";
    }

    function onScanSuccess(decodedText){
      const now = Date.now();
      const clean = (decodedText || "").toString().trim().toUpperCase();
      if (!clean) return;

      if (clean === lastScanned && (now - lastScanTime) < 1500){
        updateBanner("DUPLICATE SCAN", "status-warning");
        playError();
        vibrate(60);
        return;
      }

      lastScanned = clean;
      lastScanTime = now;

      const userPattern = /^[ST]\d{3,}$/i;
      const ipadPattern = /^IPAD-\d{3,}$/i;

      if (mode === "return"){
        if (!ipadPattern.test(clean)){
          updateBanner("INVALID IPAD QR (IPAD-001)", "status-error");
          playError();
          vibrate(80);
          return;
        }

        if (knownIpadsSet.size > 0 && !knownIpadsSet.has(clean)){
          updateBanner("UNKNOWN IPAD. BLOCKED", "status-error");
          playError();
          vibrate(90);
          return;
        }

        finishReturn(clean);
        return;
      }

      if (!userId){
        if (userPattern.test(clean)){
          if (knownUsersSet.size > 0 && !knownUsersSet.has(clean)){
            updateBanner("USER NOT IN ROSTER", "status-error");
            playError();
            vibrate(90);
            return;
          }

          userId = clean;
          document.getElementById("userPanel").style.display = "flex";
          document.getElementById("currentUserId").innerText = userId;
          updateBanner("USER OK. NOW SCAN IPADS", "status-success");
          playBeep(900, 120);
          vibrate(25);
        } else {
          updateBanner("INVALID USER QR (S001 OR T001)", "status-error");
          playError();
          vibrate(80);
        }
        return;
      }

      if (!ipadPattern.test(clean)){
        updateBanner("INVALID IPAD QR (IPAD-001)", "status-error");
        playError();
        vibrate(80);
        return;
      }

      if (knownIpadsSet.size > 0 && !knownIpadsSet.has(clean)){
        updateBanner("UNKNOWN IPAD. BLOCKED", "status-error");
        playError();
        vibrate(90);
        return;
      }

      if (unavailableIpads.includes(clean)){
        updateBanner("IPAD UNAVAILABLE", "status-error");
        playError();
        vibrate(90);
        return;
      }

      if (sessionHistory.includes(clean)){
        updateBanner("ALREADY ADDED", "status-warning");
        playError();
        vibrate(60);
        return;
      }

      sessionHistory.push(clean);
      addHistoryRowBottom_(clean);
      updateBanner("ADDED. SCAN NEXT IPAD", "status-success");
      playBeep(880, 90);
      vibrate(20);

      document.getElementById("finishBtn").disabled = (sessionHistory.length === 0);
    }

    function toggleHistory(){
      const list = document.getElementById("historyList");
      list.style.display = (list.style.display === "block") ? "none" : "block";
    }

    function clearAll(silent){
      userId = null;
      sessionHistory.length = 0;
      clearHistoryDom_();

      document.getElementById("userPanel").style.display = "none";
      document.getElementById("historyList").style.display = "none";
      document.getElementById("finishBtn").disabled = true;

      if (!silent){
        updateBanner(mode === "borrow" ? "STEP 1: SCAN USER ID" : "RETURN MODE. SCAN IPAD", "status-waiting");
        playBeep(600, 90);
        vibrate(15);
      }
    }

    async function finishSession(){
      if (isProcessing) return;
      if (!userId || sessionHistory.length === 0) return;

      isProcessing = true;
      document.getElementById("finishBtn").disabled = true;
      updateBanner("SAVING...", "status-waiting");

      const payload = {
        requestId: makeRequestId(),
        action: "borrow",
        userId: userId,
        ipads: sessionHistory.slice(0)
      };

      try{
        const resp = await fetch(SCRIPT_URL, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || "Save failed");

        updateBanner("SAVED. NEXT USER", "status-success");
        playBeep(980, 120);
        vibrate(25);

        clearAll(true);
        setTimeout(() => updateBanner("STEP 1: SCAN USER ID", "status-waiting"), 650);
        await syncSystemCache();
      } catch(err){
        console.error(err);
        updateBanner("SAVE FAILED. TAP TO RETRY", "status-error");
        playError();
        vibrate(90);

        document.getElementById("statusBanner").onclick = () => {
          document.getElementById("statusBanner").onclick = null;
          finishSession();
        };

        document.getElementById("finishBtn").disabled = false;
      } finally {
        isProcessing = false;
      }
    }

    async function finishReturn(ipadId){
      if (isProcessing) return;
      isProcessing = true;
      updateBanner("RETURNING...", "status-waiting");

      const payload = {
        requestId: makeRequestId(),
        action: "return",
        ipadId: ipadId
      };

      try{
        const resp = await fetch(SCRIPT_URL, {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error || "Return failed");

        updateBanner("RETURNED OK", "status-success");
        playBeep(980, 120);
        vibrate(25);
        await syncSystemCache();
      } catch(err){
        console.error(err);
        updateBanner("RETURN FAILED. TAP TO RETRY", "status-error");
        playError();
        vibrate(90);

        document.getElementById("statusBanner").onclick = () => {
          document.getElementById("statusBanner").onclick = null;
          finishReturn(ipadId);
        };
      } finally {
        isProcessing = false;
      }
    }
  </script>
</body>
</html>
